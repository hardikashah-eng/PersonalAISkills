<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Pencil sketch (drawn, not a photo): the kitchen table on a school night: lamp, two cups, open notebook, pencil -->
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0.07 0"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6b6b6b" stroke-width="0.9" opacity=".55"/>
    </pattern>
    <pattern id="hatchX" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a7a7a" stroke-width="0.8" opacity=".45"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#F7F4EE"/>
  <rect width="600" height="400" filter="url(#paper)"/>

  <!-- warm lamplight (the one coloured-pencil accent) -->
  <path d="M235 110 L365 110 L520 330 L80 330 Z" fill="url(#glow)"/>

  <g filter="url(#pencil)" fill="none" stroke="#3A3A3A" stroke-linecap="round" stroke-linejoin="round">
    <!-- back wall: window with night outside, cross-hatched -->
    <rect x="420" y="40" width="120" height="110" fill="url(#hatchX)" stroke-width="1.8"/>
    <path d="M480 40 L480 150 M420 95 L540 95" stroke-width="1.5"/>
    <path d="M455 62 l3 6 l-3 6 l-3 -6 z M510 118 l2 4 l-2 4 l-2 -4 z" stroke="#5a5a5a" stroke-width="1"/>
    <!-- floor line -->
    <path d="M0 330 L600 330" stroke="#8a8a8a" stroke-width="1.2"/>

    <!-- hanging lamp -->
    <path d="M300 0 L300 68" stroke-width="1.5"/>
    <path d="M262 70 L338 70 L364 110 L236 110 Z" fill="url(#hatch)" stroke-width="2"/>
    <path d="M263 72 L337 72" stroke-width="1" opacity=".6"/>
    <path d="M290 110 q10 8 20 0" stroke-width="1.4"/>

    <!-- table top in perspective, front edge, legs -->
    <path d="M110 255 L490 255 L560 315 L40 315 Z" stroke-width="2"/>
    <path d="M111 257 L489 257" stroke-width="1" opacity=".6"/>
    <path d="M40 315 L40 328 L560 328 L560 315" stroke-width="1.6"/>
    <path d="M40 328 L560 328" fill="url(#hatch)" stroke="none"/>
    <path d="M70 328 L70 395 M530 328 L530 395 M130 320 L130 380 M470 320 L470 380" stroke-width="2"/>

    <!-- two cups with steam -->
    <g stroke-width="1.8">
      <path d="M180 240 L184 270 Q199 278 214 270 L218 240 Z" fill="url(#hatch)"/>
      <ellipse cx="199" cy="240" rx="19" ry="5"/>
      <path d="M218 248 q12 2 8 14 q-3 6 -10 4"/>
      <path d="M192 230 q-6 -10 2 -18 q6 -8 0 -16 M206 228 q-6 -10 2 -18" stroke="#6b6b6b" stroke-width="1.2"/>
      <path d="M392 244 L396 274 Q411 282 426 274 L430 244 Z" fill="url(#hatch)"/>
      <ellipse cx="411" cy="244" rx="19" ry="5"/>
      <path d="M392 252 q-12 2 -8 14 q3 6 10 4"/>
      <path d="M404 234 q-6 -10 2 -18 q6 -8 0 -16 M418 232 q-6 -10 2 -18" stroke="#6b6b6b" stroke-width="1.2"/>
    </g>

    <!-- open notebook with handwriting lines -->
    <path d="M250 268 L300 262 L304 296 L252 302 Z" stroke-width="1.7"/>
    <path d="M300 262 L352 266 L350 300 L304 296" stroke-width="1.7"/>
    <path d="M300 262 L304 296" stroke-width="1.2"/>
    <path d="M258 274 L295 270 M259 282 L296 278 M260 290 L290 287 M308 272 L344 275 M308 280 L340 283 M308 288 L334 290" stroke="#6b6b6b" stroke-width="1"/>
    <!-- pencil -->
    <path d="M330 306 L392 292 L396 298 L334 312 Z" stroke-width="1.5"/>
    <path d="M392 292 L404 293 L396 298" stroke-width="1.3"/>
    <path d="M330 306 L326 310 L334 312" stroke-width="1.3"/>
  </g>
</svg>
