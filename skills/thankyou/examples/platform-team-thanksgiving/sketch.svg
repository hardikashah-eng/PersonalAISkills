<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Pencil sketch (drawn, not a photo): six figures roped together near a summit flag = the goal reached together -->
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0.07 0"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6b6b6b" stroke-width="0.9" opacity=".55"/>
    </pattern>
    <pattern id="hatch2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8a8a8a" stroke-width="0.7" opacity=".4"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="#F7F4EE"/>
  <rect width="600" height="400" filter="url(#paper)"/>

  <g filter="url(#pencil)" fill="none" stroke="#3A3A3A" stroke-linecap="round" stroke-linejoin="round">
    <!-- sun, lightly shaded -->
    <circle cx="505" cy="78" r="34" fill="url(#hatch2)" stroke="#8a8a8a" stroke-width="1.2" opacity=".8"/>
    <!-- clouds -->
    <path d="M60 90 q18 -18 38 -4 q14 -16 32 -2 q16 -4 18 10" stroke="#8a8a8a" stroke-width="1.3"/>
    <path d="M300 55 q14 -12 30 -2 q12 -12 26 0" stroke="#8a8a8a" stroke-width="1.2"/>
    <!-- birds -->
    <path d="M210 70 q6 -6 12 0 q6 -6 12 0" stroke-width="1.2"/>
    <path d="M245 90 q5 -5 10 0 q5 -5 10 0" stroke-width="1.1"/>

    <!-- far ridge -->
    <path d="M0 300 L70 250 L130 270 L200 215 L260 240" stroke="#8a8a8a" stroke-width="1.3"/>
    <path d="M470 190 L530 160 L600 200" stroke="#8a8a8a" stroke-width="1.3"/>

    <!-- main mountain: shadow side hatched -->
    <path d="M430 90 L480 140 L540 200 L600 240 L600 400 L455 400 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M0 380 L90 330 L170 300 L240 250 L300 200 L350 160 L400 120 L430 90 L480 140 L540 200 L600 240" stroke-width="2"/>
    <path d="M1 382 L91 331 L171 302 L241 251 L301 202 L351 161 L401 121 L431 92" stroke-width="1" opacity=".6"/>
    <!-- snow cap and rock lines -->
    <path d="M405 116 L418 128 L430 112 L444 126 L458 118" stroke-width="1.2"/>
    <path d="M300 200 L320 240 M350 160 L362 205 M480 140 L470 200 M540 200 L520 260" stroke="#6b6b6b" stroke-width="1.1"/>

    <!-- flag at the summit (one coloured-pencil accent) -->
    <path d="M431 90 L431 38" stroke-width="2"/>
    <path d="M432 40 L468 50 L432 62" fill="#C8693C" fill-opacity=".55" stroke="#9a4a26" stroke-width="1.4"/>

    <!-- rope linking the climbers -->
    <path d="M171 286 Q193 278 216 254 Q239 236 263 218 Q285 200 306 182 Q326 168 346 150 Q366 134 386 118"
          stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- six climbers, seen from behind, leaning into the slope -->
    <g stroke-width="1.8">
      <g transform="translate(170 300) rotate(10)"><circle cx="0" cy="-30" r="5"/><path d="M0 -25 L2 -12 L-3 0 M2 -12 L7 0 M0 -21 L8 -16"/><rect x="-6" y="-24" width="5" height="9" rx="1.5"/></g>
      <g transform="translate(215 268) rotate(10)"><circle cx="0" cy="-30" r="5"/><path d="M0 -25 L2 -12 L-3 0 M2 -12 L7 0 M0 -21 L8 -16"/><rect x="-6" y="-24" width="5" height="9" rx="1.5"/></g>
      <g transform="translate(262 232) rotate(10)"><circle cx="0" cy="-30" r="5"/><path d="M0 -25 L2 -12 L-3 0 M2 -12 L7 0 M0 -21 L8 -16"/><rect x="-6" y="-24" width="5" height="9" rx="1.5"/></g>
      <g transform="translate(305 196) rotate(10)"><circle cx="0" cy="-30" r="5"/><path d="M0 -25 L2 -12 L-3 0 M2 -12 L7 0 M0 -21 L8 -16"/><rect x="-6" y="-24" width="5" height="9" rx="1.5"/></g>
      <g transform="translate(345 164) rotate(10)"><circle cx="0" cy="-30" r="5"/><path d="M0 -25 L2 -12 L-3 0 M2 -12 L7 0 M0 -21 L8 -16"/><rect x="-6" y="-24" width="5" height="9" rx="1.5"/></g>
      <g transform="translate(385 132) rotate(10)"><circle cx="0" cy="-30" r="5"/><path d="M0 -25 L2 -12 L-3 0 M2 -12 L7 0 M0 -21 L10 -26"/><rect x="-6" y="-24" width="5" height="9" rx="1.5"/></g>
    </g>

    <!-- foreground grass strokes -->
    <path d="M20 392 l4 -12 M28 394 l2 -10 M40 393 l5 -13 M70 394 l3 -9 M110 393 l4 -12" stroke="#6b6b6b" stroke-width="1"/>
  </g>
</svg>
