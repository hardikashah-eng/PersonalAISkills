<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Team header: a constellation of six stars shaped like a summit (one star per teammate), autumn leaves for Thanksgiving -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3456"/>
      <stop offset="1" stop-color="#8C5A4A"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <path d="M0 170 Q80 150 160 165 T320 160 V200 H0 Z" fill="#5A3A33"/>
  <path d="M0 182 Q90 168 170 180 T320 176 V200 H0 Z" fill="#43292A"/>

  <!-- constellation: six stars, one per teammate, joined like a rope to a summit -->
  <g stroke="#F6E7D6" stroke-width="1.2" stroke-dasharray="3 4" opacity=".75" fill="none">
    <path d="M70 130 L105 108 L138 90 L168 66 L196 82 L232 104"/>
  </g>
  <g fill="#FCE9C8">
    <circle cx="70" cy="130" r="3.4"/><circle cx="105" cy="108" r="3.4"/><circle cx="138" cy="90" r="3.4"/>
    <circle cx="168" cy="66" r="4.6"/><circle cx="196" cy="82" r="3.4"/><circle cx="232" cy="104" r="3.4"/>
  </g>
  <!-- small flag at the brightest star -->
  <path d="M168 62 L168 40" stroke="#FCE9C8" stroke-width="1.6"/>
  <path d="M169 41 L186 46 L169 52 Z" fill="#E9964F"/>

  <!-- faint background stars -->
  <g fill="#FCE9C8" opacity=".45">
    <circle cx="30" cy="40" r="1.2"/><circle cx="262" cy="30" r="1.4"/><circle cx="292" cy="70" r="1"/><circle cx="110" cy="30" r="1"/><circle cx="220" cy="20" r="1.1"/>
  </g>

  <!-- autumn leaves (three) -->
  <g transform="translate(276 128) rotate(30)"><ellipse rx="7" ry="3.4" fill="#C8693C"/><path d="M-7 0 L-11 0" stroke="#7A3E22" stroke-width="1"/></g>
  <g transform="translate(40 160) rotate(-25)"><ellipse rx="6" ry="3" fill="#D9963A"/><path d="M-6 0 L-10 0" stroke="#7A3E22" stroke-width="1"/></g>
  <g transform="translate(250 166) rotate(65)"><ellipse rx="5.5" ry="2.8" fill="#B5462E"/><path d="M-5.5 0 L-9 0" stroke="#7A3E22" stroke-width="1"/></g>
</svg>
