<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Story: the whiteboard evenings (box-and-arrow constellation) + "shoulders of giants" (two figures on a summit)
       Personal: Maya loves sunrise hikes (mountains, trail)
       Occasion: Thanksgiving (falling autumn leaves)
       One-of-one: the constellation is the three-box sketch from that night; 5 leaves = 5 years -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3CFAE"/>
      <stop offset="1" stop-color="#FBEBD9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#8A5A44" opacity=".7"/>
    </marker>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="200" cy="108" r="54" fill="#F2B477" opacity=".28"/>
  <circle cx="200" cy="108" r="32" fill="#E9964F" opacity=".92"/>

  <!-- whiteboard constellation -->
  <g fill="none" stroke="#8A5A44" stroke-width="1.4" opacity=".7">
    <rect x="28" y="26" width="26" height="16" rx="3"/>
    <rect x="82" y="44" width="26" height="16" rx="3"/>
    <rect x="132" y="20" width="26" height="16" rx="3"/>
    <path d="M55 36 L80 49" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <path d="M109 49 L130 32" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  </g>
  <g fill="#8A5A44" opacity=".55">
    <circle cx="41" cy="34" r="1.6"/><circle cx="95" cy="52" r="1.6"/><circle cx="145" cy="28" r="1.6"/>
  </g>

  <!-- far ridge -->
  <path d="M0 142 L58 98 L102 124 L148 88 L204 128 L252 96 L320 134 V200 H0 Z" fill="#DCA27A"/>
  <!-- near ridge with summit at (180,100) -->
  <path d="M0 168 L66 124 L118 152 L180 100 L238 150 L286 128 L320 148 V200 H0 Z" fill="#A9583A"/>

  <!-- trail to the summit -->
  <path d="M34 200 C 72 182, 108 176, 128 160 S 164 122, 179 102" fill="none"
        stroke="#FBEBD9" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" opacity=".85"/>

  <!-- two figures on the summit, the taller one pointing toward the sun -->
  <g fill="#3B2F2A">
    <circle cx="175" cy="86.5" r="3"/>
    <rect x="172.4" y="89.5" width="5.2" height="10.5" rx="2.2"/>
    <path d="M177 92 L187 85" stroke="#3B2F2A" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="185.5" cy="90.5" r="2.5"/>
    <rect x="183.4" y="93" width="4.2" height="7" rx="1.8"/>
  </g>

  <!-- five autumn leaves -->
  <g>
    <g transform="translate(250 40) rotate(28)"><ellipse rx="7" ry="3.4" fill="#C8693C"/><path d="M-7 0 L-11 0" stroke="#7A3E22" stroke-width="1"/></g>
    <g transform="translate(286 70) rotate(-35)"><ellipse rx="6" ry="3" fill="#D9963A"/><path d="M-6 0 L-10 0" stroke="#7A3E22" stroke-width="1"/></g>
    <g transform="translate(232 76) rotate(62)"><ellipse rx="5.5" ry="2.8" fill="#B5462E"/><path d="M-5.5 0 L-9 0" stroke="#7A3E22" stroke-width="1"/></g>
    <g transform="translate(60 76) rotate(-18)"><ellipse rx="6" ry="3" fill="#D9963A"/><path d="M-6 0 L-10 0" stroke="#7A3E22" stroke-width="1"/></g>
    <g transform="translate(296 168) rotate(40)"><ellipse rx="6.5" ry="3.2" fill="#E3B04B"/><path d="M-6.5 0 L-10.5 0" stroke="#7A3E22" stroke-width="1"/></g>
  </g>
</svg>
