<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Story: an open book whose page grows a sprout (he grew a learner); a cursor line on the page (first program)
       Occasion: Diwali (diya, rangoli dots — 5 and 3, never 4)
       One-of-one: three small flames for the three afternoons a week -->
  <rect width="320" height="200" fill="#2F2A4F"/>
  <g fill="#F7D98B">
    <circle cx="40" cy="30" r="1.6"/><circle cx="92" cy="18" r="1.2"/><circle cx="268" cy="24" r="1.6"/>
    <circle cx="300" cy="62" r="1.2"/><circle cx="222" cy="40" r="1"/>
  </g>

  <!-- open book with sprout -->
  <g transform="translate(70 104)">
    <path d="M0 40 Q30 28 58 40 V82 Q30 70 0 82 Z" fill="#FFF8EC"/>
    <path d="M58 40 Q86 28 116 40 V82 Q86 70 58 82 Z" fill="#F3E8D3"/>
    <path d="M58 40 V82" stroke="#C9B48F" stroke-width="1.2"/>
    <g stroke="#B9A57F" stroke-width="1.4" stroke-linecap="round">
      <path d="M10 50 H44"/><path d="M10 58 H38"/><path d="M10 66 H30"/><path d="M33 66 H35" stroke="#B8461F" stroke-width="2.4"/>
    </g>
    <path d="M86 40 C86 22, 84 14, 86 2" stroke="#5E8C4E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M86 18 C74 14, 70 6, 72 0 C80 2, 86 8, 86 18 Z" fill="#7BAE5E"/>
    <path d="M86 10 C96 6, 102 -2, 100 -8 C92 -6, 86 0, 86 10 Z" fill="#8CC06C"/>
  </g>

  <!-- diya -->
  <g transform="translate(232 150)">
    <ellipse cx="0" cy="-26" rx="26" ry="30" fill="#F7B955" opacity=".18"/>
    <path d="M-34 0 Q0 30 34 0 Q22 -6 0 -6 Q-22 -6 -34 0 Z" fill="#C2552A"/>
    <path d="M-34 0 Q0 8 34 0" stroke="#F0A250" stroke-width="2" fill="none"/>
    <path d="M0 -8 C-8 -18 -4 -30 0 -40 C4 -30 8 -18 0 -8 Z" fill="#F7B955"/>
    <path d="M0 -12 C-3 -18 -2 -24 0 -30 C2 -24 3 -18 0 -12 Z" fill="#FFF1C4"/>
  </g>

  <!-- three small flames -->
  <g fill="#F7B955" opacity=".9">
    <path d="M196 28 c-3 -4 -1.5 -9 0 -12 c1.5 3 3 8 0 12 z"/>
    <path d="M214 22 c-3 -4 -1.5 -9 0 -12 c1.5 3 3 8 0 12 z"/>
    <path d="M232 28 c-3 -4 -1.5 -9 0 -12 c1.5 3 3 8 0 12 z"/>
  </g>

  <!-- rangoli dots: arc of 5 + 3 -->
  <g fill="#E86A92">
    <circle cx="186" cy="182" r="3"/><circle cx="204" cy="188" r="3"/><circle cx="232" cy="190" r="3"/>
    <circle cx="260" cy="188" r="3"/><circle cx="278" cy="182" r="3"/>
  </g>
  <g fill="#F7D98B"><circle cx="218" cy="194" r="2"/><circle cx="246" cy="194" r="2"/><circle cx="232" cy="180" r="2"/></g>
</svg>
