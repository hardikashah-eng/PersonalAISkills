<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Story: Friday chai runs (two cups, steam) during a launch (a small rocket arcing between the steam trails)
       One-of-one: three stars for the three people who always came along -->
  <rect width="320" height="200" fill="#E9F0EA"/>
  <circle cx="160" cy="210" r="120" fill="#D6E5D9"/>

  <!-- rocket arc -->
  <path d="M70 120 C 110 30, 210 30, 252 70" fill="none" stroke="#3F7D5C" stroke-width="1.6"
        stroke-dasharray="3 5" stroke-linecap="round" opacity=".7"/>
  <g transform="translate(252 70) rotate(40)">
    <path d="M0 -12 C5 -6 5 4 3 8 H-3 C-5 4 -5 -6 0 -12 Z" fill="#F2A541"/>
    <circle cx="0" cy="-3" r="1.8" fill="#FFFEFB"/>
    <path d="M-3 8 L-6 12 L-3 10 Z M3 8 L6 12 L3 10 Z" fill="#C8693C"/>
  </g>

  <!-- stars -->
  <g fill="#3F7D5C" opacity=".6">
    <circle cx="48" cy="34" r="2"/><circle cx="276" cy="28" r="2"/><circle cx="160" cy="22" r="1.6"/>
  </g>

  <!-- left cup (glass with chai) -->
  <g transform="translate(108 112)">
    <path d="M-14 -6 C-8 -18 -18 -26 -10 -38" stroke="#9DB8A4" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M0 -6 C6 -18 -4 -26 4 -38" stroke="#9DB8A4" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M-22 0 L22 0 L17 46 H-17 Z" fill="#FFFEFB" opacity=".85"/>
    <path d="M-20.5 12 L20.5 12 L17 46 H-17 Z" fill="#C9874E"/>
    <path d="M-22 0 L22 0" stroke="#2E3A33" stroke-width="1.4" opacity=".3"/>
  </g>

  <!-- right cup (glass with chai) -->
  <g transform="translate(212 118)">
    <path d="M-6 -6 C0 -18 -10 -26 -2 -38" stroke="#9DB8A4" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M8 -6 C14 -18 4 -26 12 -38" stroke="#9DB8A4" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M-20 0 L20 0 L15.5 42 H-15.5 Z" fill="#FFFEFB" opacity=".85"/>
    <path d="M-18.6 10 L18.6 10 L15.5 42 H-15.5 Z" fill="#B97842"/>
    <path d="M-20 0 L20 0" stroke="#2E3A33" stroke-width="1.4" opacity=".3"/>
  </g>

  <!-- table line -->
  <path d="M40 162 H280" stroke="#2E3A33" stroke-width="1.5" opacity=".25" stroke-linecap="round"/>
</svg>
