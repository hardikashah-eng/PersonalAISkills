<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380">
  <!-- Pencil sketch of the feeling: a steaming cup on a windowsill, autumn tree outside, leaves falling (orange is the one accent) -->
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0.07 0"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6b6b6b" stroke-width="0.9" opacity=".5"/>
    </pattern>
    <pattern id="hatchL" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a8a8a" stroke-width="0.7" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="600" height="380" fill="#F7F4EE"/>
  <rect width="600" height="380" filter="url(#paper)"/>

  <g filter="url(#pencil)" fill="none" stroke="#3A3A3A" stroke-linecap="round" stroke-linejoin="round">
    <!-- wall shading either side of the window -->
    <rect x="0" y="0" width="110" height="300" fill="url(#hatchL)" stroke="none"/>
    <rect x="490" y="0" width="110" height="300" fill="url(#hatchL)" stroke="none"/>
    <!-- window frame -->
    <rect x="110" y="30" width="380" height="250" stroke-width="2.2"/>
    <rect x="112" y="32" width="376" height="246" stroke-width="1" opacity=".5"/>
    <path d="M300 30 L300 280 M110 155 L490 155" stroke-width="1.8"/>
    <!-- outside: distant hills, the tree -->
    <path d="M112 230 Q180 200 250 222 T380 210 T488 226" stroke="#8a8a8a" stroke-width="1.2"/>
    <path d="M360 278 C362 230 356 200 366 160 M366 190 C392 178 404 160 410 140 M364 205 C340 192 328 176 322 158 M367 170 C372 150 386 130 380 112"
          stroke-width="2"/>
    <path d="M330 150 q-30 -10 -24 -40 q4 -30 40 -34 q20 -26 52 -10 q34 -6 40 24 q30 12 16 42 q-8 26 -40 22 q-20 16 -46 6 q-24 6 -38 -10 z"
          fill="url(#hatch)" stroke-width="1.5"/>
    <!-- sill -->
    <path d="M90 282 L510 282 L522 300 L78 300 Z" stroke-width="2"/>
    <path d="M78 300 L522 300" fill="url(#hatch)"/>
    <!-- cup with steam -->
    <path d="M190 236 L194 276 Q214 286 234 276 L238 236 Z" fill="url(#hatch)" stroke-width="1.9"/>
    <ellipse cx="214" cy="236" rx="24" ry="6" stroke-width="1.8"/>
    <path d="M238 246 q16 3 11 18 q-4 8 -13 5" stroke-width="1.7"/>
    <path d="M206 224 q-8 -14 2 -26 q8 -12 0 -24 M222 222 q-8 -14 2 -26 q8 -12 0 -24" stroke="#6b6b6b" stroke-width="1.3"/>
    <!-- small pumpkin on the sill -->
    <ellipse cx="420" cy="266" rx="30" ry="17" stroke-width="1.8"/>
    <path d="M404 252 q-6 14 0 28 M436 252 q6 14 0 28 M420 250 L420 282" stroke-width="1.2"/>
    <path d="M420 249 q2 -10 8 -12" stroke-width="1.6"/>
    <!-- open book -->
    <path d="M262 278 L300 270 L338 278" stroke-width="1.5"/>
    <path d="M262 278 L264 266 L300 260 L336 266 L338 278" stroke-width="1.3"/>
  </g>

  <!-- falling leaves, coloured pencil (five) -->
  <g fill="#C8693C" fill-opacity=".55" stroke="#9a4a26" stroke-width="1" filter="url(#pencil)">
    <path d="M150 70 q10 -8 18 2 q-8 10 -18 -2 z"/>
    <path d="M250 110 q10 -6 16 4 q-9 8 -16 -4 z"/>
    <path d="M440 70 q9 -9 18 0 q-9 9 -18 0 z"/>
    <path d="M210 190 q9 -7 16 2 q-8 9 -16 -2 z"/>
    <path d="M460 200 q10 -6 15 4 q-9 7 -15 -4 z"/>
  </g>
</svg>
