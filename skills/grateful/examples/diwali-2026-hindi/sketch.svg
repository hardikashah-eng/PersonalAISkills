<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380">
  <!-- Pencil sketch of the occasion: five diyas on a doorstep, rangoli dots, an open door with warm light (flames are the one accent) -->
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0.07 0"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6b6b6b" stroke-width="0.9" opacity=".5"/>
    </pattern>
    <pattern id="hatchX" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a7a7a" stroke-width="0.8" opacity=".45"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".5"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="380" fill="#F7F4EE"/>
  <rect width="600" height="380" filter="url(#paper)"/>

  <!-- warm light from the door -->
  <ellipse cx="300" cy="170" rx="120" ry="130" fill="url(#glow)"/>

  <g filter="url(#pencil)" fill="none" stroke="#3A3A3A" stroke-linecap="round" stroke-linejoin="round">
    <!-- wall, cross-hatched, with the doorway -->
    <path d="M0 0 H600 V250 H0 Z" stroke="none" fill="url(#hatchX)" opacity=".7"/>
    <rect x="220" y="40" width="160" height="210" fill="#F7F4EE" stroke-width="2.2"/>
    <rect x="223" y="43" width="154" height="207" stroke-width="1" opacity=".5"/>
    <!-- toran (garland) over the door -->
    <path d="M206 34 Q300 64 394 34" stroke-width="1.6"/>
    <g stroke-width="1.3"><path d="M230 42 l-4 12 l8 0 z M262 52 l-4 12 l8 0 z M300 56 l-4 12 l8 0 z M338 52 l-4 12 l8 0 z M370 42 l-4 12 l8 0 z"/></g>
    <!-- doorstep -->
    <path d="M150 250 L450 250 L470 276 L130 276 Z" stroke-width="2"/>
    <path d="M130 276 L470 276 L470 288 L130 288 Z" fill="url(#hatch)" stroke-width="1.4"/>
    <!-- floor line -->
    <path d="M0 288 L600 288" stroke="#8a8a8a" stroke-width="1.1"/>
    <!-- five diyas on the step -->
    <g stroke-width="1.7">
      <path d="M170 262 q16 14 32 0 q-8 -4 -16 -4 q-8 0 -16 4 z" fill="url(#hatch)"/>
      <path d="M226 262 q16 14 32 0 q-8 -4 -16 -4 q-8 0 -16 4 z" fill="url(#hatch)"/>
      <path d="M284 262 q16 14 32 0 q-8 -4 -16 -4 q-8 0 -16 4 z" fill="url(#hatch)"/>
      <path d="M342 262 q16 14 32 0 q-8 -4 -16 -4 q-8 0 -16 4 z" fill="url(#hatch)"/>
      <path d="M398 262 q16 14 32 0 q-8 -4 -16 -4 q-8 0 -16 4 z" fill="url(#hatch)"/>
    </g>
    <!-- rangoli: a circle of dots and petals on the floor -->
    <ellipse cx="300" cy="330" rx="110" ry="28" stroke-width="1.4"/>
    <ellipse cx="300" cy="330" rx="62" ry="15" stroke-width="1.2"/>
    <g stroke-width="1.2">
      <path d="M300 315 q10 15 0 30 q-10 -15 0 -30 z M238 330 q31 -8 62 0 q-31 8 -62 0 z M362 330 q-31 -8 -62 0 q31 8 62 0 z"/>
    </g>
  </g>

  <!-- flames and rangoli dots, coloured pencil -->
  <g filter="url(#pencil)">
    <g fill="#F2A541" fill-opacity=".85" stroke="#C8693C" stroke-width="1">
      <path d="M186 256 c-5 -6 -3 -13 0 -18 c3 5 5 12 0 18 z"/>
      <path d="M242 256 c-5 -6 -3 -13 0 -18 c3 5 5 12 0 18 z"/>
      <path d="M300 256 c-5 -6 -3 -13 0 -18 c3 5 5 12 0 18 z"/>
      <path d="M358 256 c-5 -6 -3 -13 0 -18 c3 5 5 12 0 18 z"/>
      <path d="M414 256 c-5 -6 -3 -13 0 -18 c3 5 5 12 0 18 z"/>
    </g>
    <g fill="#D9536F" fill-opacity=".6">
      <circle cx="196" cy="330" r="3.2"/><circle cx="225" cy="312" r="3.2"/><circle cx="300" cy="304" r="3.2"/>
      <circle cx="375" cy="312" r="3.2"/><circle cx="404" cy="330" r="3.2"/><circle cx="375" cy="349" r="3.2"/>
      <circle cx="300" cy="357" r="3.2"/><circle cx="225" cy="349" r="3.2"/>
    </g>
  </g>
</svg>
